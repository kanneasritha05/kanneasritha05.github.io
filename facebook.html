<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heads{
            text-align: center;
            border: 1px solid whitesmoke;
            box-shadow: whitesmoke; 
            align-items: center;
            padding: 10px;
            background-color: white;
            border-radius: 10px;
            height: 50vh;
            width: 400px;
            margin-bottom:200px;
        }
        .mp{
            display: flex;
            justify-content: center;
            align-items: center;
            height:100vh;
            margin: 0px;
        }
        body{
             background-color:silver;
             margin: 0px;

        }


    </style>
</head>
<body>
    <h1 style="color: blue; font-weight: 800px; text-align: center; margin-top:50px;">Facebook</h1>
    <div class="mp">
        <div class="heads">
        <div>
            <h3>Log in to Facebook</h3>
        </div>
    <div style="margin: 20px;">
        <input type ="email" name="mail" placeholder="email or phone number" size="40" style="height: 30px;"><br>
    </div> 
    <div style="margin:20px;">
        <input type="password" name="password" placeholder="password" size="40" style="height: 30px;"><br>
    </div>
    <div style="margin: 30px;" >
         <input type="submit" value="LOGIN IN" style="height:40px; width:300px;color:white;background-color: blue; ">
    </div>
    <div>
        <h5 style="color:rgb(0, 115, 255) ">forgotten account ? sign up for Facebook</h5>
    </div>
    </div>
</body>
</html>
